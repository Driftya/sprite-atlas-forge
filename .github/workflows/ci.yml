name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows

      - name: Restore
        shell: pwsh
        run: dotnet restore Driftya.SpriteAtlasForge.slnx --nologo

      - name: Restore Windows runtime pack
        shell: pwsh
        run: >-
          dotnet restore src/Driftya.SpriteAtlasForge.ClientApplication/Driftya.SpriteAtlasForge.ClientApplication.csproj
          --runtime win-x64
          --nologo

      - name: Build and test
        shell: pwsh
        run: ./eng/verify.ps1 -Configuration Release -NoRestore

      - name: Publish self-contained Windows application
        shell: pwsh
        run: >-
          dotnet publish src/Driftya.SpriteAtlasForge.ClientApplication/Driftya.SpriteAtlasForge.ClientApplication.csproj
          --framework net10.0-windows10.0.19041.0
          --configuration Release
          --output artifacts/windows-x64
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: SpriteAtlasForge-windows-x64
          path: artifacts/windows-x64
          if-no-files-found: error
          retention-days: 14
